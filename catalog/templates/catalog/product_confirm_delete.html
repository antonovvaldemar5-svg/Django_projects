{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить {{ product.name }}?</h1>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
